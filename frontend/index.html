<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 招聘画像系统</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="header-left">
        <div class="app-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2a4 4 0 0 1 4 4v1a4 4 0 0 1-8 0V6a4 4 0 0 1 4-4z"/>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
            <path d="M3 21v-2a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4v2"/>
          </svg>
        </div>
        <span class="app-title">AI 招聘画像系统</span>
        <span class="app-subtitle">需求 Agent + 画像构建</span>
      </div>
      <div class="header-right">
        <button class="header-btn" id="new-chat-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 5v14m-7-7h14"/>
          </svg>
          新对话
        </button>
        <button class="header-btn" id="save-chat-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/>
            <polyline points="17 21 17 13 7 13 7 21"/>
            <polyline points="7 3 7 8 15 8"/>
          </svg>
          保存
        </button>
        <button class="header-btn" id="history-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <polyline points="12 6 12 12 16 14"/>
          </svg>
          历史
        </button>
        <button class="header-btn" id="api-key-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 11-7.778 7.778 5.5 5.5 0 017.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
          </svg>
          API Key
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="app-main">
      <!-- Left Panel: Profile Preview -->
      <aside class="profile-panel">
        <div class="panel-header">
          <div class="panel-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/>
              <polyline points="10 9 9 9 8 9"/>
            </svg>
            人才画像
          </div>
          <div class="panel-actions">
            <button class="panel-action-btn" id="edit-btn" title="编辑JSON">编辑</button>
            <button class="panel-action-btn" id="export-btn" title="导出JSON">导出</button>
            <button class="panel-action-btn primary" id="save-btn" title="保存到服务器">保存</button>
          </div>
        </div>
        <div class="profile-content" id="profile-content">
          <!-- Profile content will be rendered here -->
        </div>
      </aside>

      <!-- Right Panel: Chat -->
      <section class="chat-panel">
        <div class="chat-messages" id="chat-messages">
          <!-- Messages will be rendered here -->
        </div>
        <div class="chat-input-area">
          <div class="chat-input-wrapper">
            <textarea
              class="chat-input"
              id="chat-input"
              placeholder="粘贴JD文本，或描述你的招聘需求..."
              rows="1"
            ></textarea>
            <button type="button" class="chat-send-btn" id="chat-send-btn" title="发送">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="22" y1="2" x2="11" y2="13"/>
                <polygon points="22 2 15 22 11 13 2 9 22 2"/>
              </svg>
            </button>
          </div>
          <div class="chat-input-hint">
            <span>按 Enter 发送，Shift+Enter 换行</span>
            <button type="button" class="generate-profile-btn" id="generate-profile-btn" title="基于当前对话生成结构化人才画像">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
                <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="16" y1="13" x2="8" y2="13"/>
                <line x1="16" y1="17" x2="8" y2="17"/>
              </svg>
              生成画像
            </button>
          </div>
        </div>
      </section>
    </main>

    <!-- History Panel (slide-in) -->
    <div class="history-panel" id="history-panel">
      <div class="history-header">
        <span class="history-title">历史画像</span>
        <button class="history-close" id="history-close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="history-list" id="history-list">
        <div class="history-empty">暂无保存的画像</div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/app.js"></script>

  <!-- History panel close button handler -->
  <script>
    document.getElementById('history-close').addEventListener('click', () => {
      document.getElementById('history-panel').classList.remove('open');
    });
  </script>
</body>
</html>
